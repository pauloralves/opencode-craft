name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SQLite CLI & Python
        run: sudo apt-get update && sudo apt-get install -y sqlite3 python3

      - name: Run test suite
        run: npm test

      - name: Verify package bundle (dry-run)
        run: npm pack --dry-run
